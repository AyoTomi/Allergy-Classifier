<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Food Allergy Classifier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 40px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="white" opacity="0.1"/><circle cx="80" cy="80" r="1" fill="white" opacity="0.1"/><circle cx="40" cy="70" r="1.5" fill="white" opacity="0.1"/></svg>');
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translateX(0) translateY(0); }
            100% { transform: translateX(-100px) translateY(-100px); }
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .main-content {
            padding: 40px;
        }

        .user-input-section {
            background: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid #e2e8f0;
        }

        .user-input-section h3 {
            color: #2d3748;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            width: 120px;
            text-align: center;
            font-weight: 500;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .upload-area {
            border: 3px dashed #cbd5e0;
            border-radius: 20px;
            width: 100%;
            min-height: 250px;
            text-align: center;
            padding: 40px 20px;
            margin: 30px 0;
            background: #f7fafc;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(79, 172, 254, 0.05) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .upload-area:hover::before {
            transform: translateX(100%);
        }

        .upload-area.dragover {
            border-color: #4facfe;
            background: linear-gradient(135deg, #e6f3ff 0%, #f0f9ff 100%);
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.2);
        }

        .upload-content {
            position: relative;
            z-index: 1;
        }

        .upload-icon {
            font-size: 3rem;
            color: #4facfe;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .upload-text {
            font-size: 1.2rem;
            color: #4a5568;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #718096;
            font-size: 0.9rem;
        }

        .image-preview {
            text-align: center;
            margin: 30px 0;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 350px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .image-preview img:hover {
            transform: scale(1.02);
        }

        .analyze-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 30px auto;
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.3);
        }

        .analyze-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(79, 172, 254, 0.4);
        }

        .analyze-btn:active {
            transform: translateY(0);
        }

        .analyze-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            margin-top: 40px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .results-header h3 {
            color: #2d3748;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .prediction-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .prediction-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .food-emoji {
            font-size: 2.5rem;
        }

        .food-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3748;
        }

        .confidence-bar {
            background: #e2e8f0;
            border-radius: 10px;
            height: 8px;
            margin: 15px 0;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 10px;
            transition: width 1s ease-out;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-item {
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
            border-left: 4px solid #4facfe;
        }

        .info-item h4 {
            color: #2d3748;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-item p {
            color: #4a5568;
            line-height: 1.5;
        }

        .allergen-warning {
            background: linear-gradient(135deg, #fed7d7 0%, #fbb6ce 100%);
            border: 2px solid #f56565;
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 101, 101, 0.4); }
            50% { box-shadow: 0 0 0 15px rgba(245, 101, 101, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 101, 101, 0); }
        }

        .allergen-safe {
            background: linear-gradient(135deg, #c6f6d5 0%, #9ae6b4 100%);
            border: 2px solid #38a169;
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .allergen-info {
            background: linear-gradient(135deg, #bee3f8 0%, #90cdf4 100%);
            border: 2px solid #3182ce;
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .alert-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .alert-icon {
            font-size: 1.5rem;
        }

        .alert-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0;
        }

        .alert-message {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .recommendation {
            font-weight: 600;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .header {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .main-content {
                padding: 25px;
            }

            .input-group {
                justify-content: center;
            }

            .upload-area {
                min-height: 200px;
                padding: 30px 15px;
            }

            .upload-icon {
                font-size: 2.5rem;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-brain"></i> AI Food Allergy Classifier</h1>
            <p>Advanced food recognition with intelligent allergy detection powered by machine learning</p>
        </div>

        <div class="main-content">
            <div class="user-input-section">
                <h3><i class="fas fa-user-md"></i> Patient Information</h3>
                <div class="input-group">
                    <label for="userId">Patient ID:</label>
                    <div class="input-wrapper">
                        <input type="text" id="userId" value="2" placeholder="Enter ID">
                    </div>
                    <span style="color: #718096; font-size: 0.9rem;">Demo IDs: 1-4</span>
                </div>
            </div>

            <div class="upload-area" id="uploadArea">
                <div class="upload-content">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <div class="upload-text">Drop your food image here</div>
                    <div class="upload-subtext">or click to browse • Supports JPG, PNG, GIF • Max 10MB</div>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                </div>
            </div>

            <div id="imagePreview" class="image-preview"></div>
            
            <button id="predictBtn" class="analyze-btn" style="display: none;">
                <i class="fas fa-microscope"></i>
                <span id="btnText">Analyze Food & Check Allergies</span>
                <div id="loadingSpinner" class="loading-spinner" style="display: none;"></div>
            </button>
            
            <div id="results" class="results" style="display: none;">
                <div class="results-header">
                    <h3><i class="fas fa-chart-line"></i> Analysis Results</h3>
                </div>
                <div class="prediction-card">
                    <div id="prediction"></div>
                </div>
                <div id="allergenCheck"></div>
            </div>
        </div>
    </div>

    <script>
        // Nigerian food labels (sorted alphabetically as in Python)
        const LABELS = [
            "Abacha and Ugba(african salad)",
            "Akara",
            "Amala",
            "Banga soup",
            "Beans and Plantain",
            "Bitter leaf soup",
            "Chicken stew",
            "Dodo (fried plantain)",
            "Eba",
            "Egusi soup",
            "Fish stew",
            "Fried rice",
            "Fufu",
            "Gbegiri soup",
            "Jollof rice",
            "Moi moi",
            "Nkwobi",
            "Nsala soup",
            "Ofe nsala (white soup)",
            "Ogbono soup",
            "Okra soup",
            "Pepper soup",
            "Pounded yam",
            "Suya",
            "Tuwo shinkafa",
            "Vegetable soup",
            "Yam porridge"
        ];

        // Food ingredients and allergens data
        const INGREDIENT_DATA = [
            {
                "food_name": "Abacha and Ugba(african salad)",
                "ingredients": ["cassava flakes (abacha)", "ugba (oil bean)", "palm oil", "potash", "ground crayfish", "shredded stockfish", "garden egg", "utazi leaves", "onions", "ground pepper", "salt", "seasoning cube"],
                "allergens": ["legumes", "crayfish", "stockfish"]
            },
            {
                "food_name": "Akara",
                "ingredients": ["black-eyed beans", "onions", "pepper", "salt", "palm oil"],
                "allergens": ["legumes"]
            },
            {
                "food_name": "Jollof rice",
                "ingredients": ["rice", "tomatoes", "onions", "pepper", "chicken stock", "bay leaves", "curry powder", "thyme", "salt", "palm oil"],
                "allergens": ["none"]
            },
            {
                "food_name": "Egusi soup",
                "ingredients": ["melon seeds", "spinach", "meat", "stockfish", "palm oil", "onions", "pepper", "seasoning"],
                "allergens": ["nuts/seeds", "stockfish"]
            },
            {
                "food_name": "Suya",
                "ingredients": ["beef", "suya spice", "groundnuts", "ginger", "garlic", "pepper"],
                "allergens": ["nuts/seeds"]
            }
        ];

        // User health data simulation
        const HEALTH_DATA = [
            { user_id: "1", food_type: "nuts", allergic: 1 },
            { user_id: "2", food_type: "dairy", allergic: 1 },
            { user_id: "3", food_type: "shellfish", allergic: 1 },
            { user_id: "4", food_type: "gluten", allergic: 0 }
        ];

        // Allergen category mapping
        const ALLERGEN_CATEGORY_MAP = {
            "legumes": "legumes",
            "crayfish": "shellfish", 
            "stockfish": "fish",
            "nuts/seeds": "nuts",
            "dairy": "dairy",
            "gluten": "gluten"
        };

        let model = null;
        let currentImage = null;

        // Load model (placeholder - you would need the actual converted model)
        async function loadModel() {
            try {
                // This would load your converted TensorFlow.js model
                // model = await tf.loadLayersModel('./tfjs_model/model.json');
                console.log('Model loading simulation (replace with actual model path)');
                return true;
            } catch (error) {
                console.error('Error loading model:', error);
                return false;
            }
        }

        // File handling
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const imagePreview = document.getElementById('imagePreview');
        const predictBtn = document.getElementById('predictBtn');
        const results = document.getElementById('results');

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (file.type.startsWith('image/')) {
                // Check file size (max 10MB)
                if (file.size > 10 * 1024 * 1024) {
                    alert('File size too large. Please choose an image under 10MB.');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    currentImage = e.target.result;
                    imagePreview.innerHTML = `<img src="${currentImage}" alt="Uploaded food">`;
                    predictBtn.style.display = 'block';
                    results.style.display = 'none';
                };
                reader.readAsDataURL(file);
            } else {
                alert('Please select a valid image file (JPG, PNG, GIF).');
            }
        }

        // API Configuration
        const API_BASE_URL = 'http://localhost:5000';

        // Real prediction using Keras model via API
        async function predictWithKerasModel(imageData, userId) {
            try {
                const response = await fetch(`${API_BASE_URL}/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image: imageData,
                        userId: userId
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const result = await response.json();
                return result;

            } catch (error) {
                console.error('Prediction error:', error);
                // Fallback to simulation if API fails
                return simulatePrediction();
            }
        }

        // Fallback simulation for offline mode
        function simulatePrediction() {
            const randomIndex = Math.floor(Math.random() * LABELS.length);
            const confidence = 0.7 + Math.random() * 0.25;
            const food = LABELS[randomIndex];
            const { ingredients, allergens } = getIngredientsAndAllergens(food);
            
            return {
                prediction: { food, confidence },
                ingredients,
                allergens,
                allergyCheck: null, // Will be computed separately
                success: true,
                isSimulated: true
            };
        }

        // Get ingredients and allergens for a food
        function getIngredientsAndAllergens(foodName) {
            const entry = INGREDIENT_DATA.find(item => 
                item.food_name.toLowerCase() === foodName.toLowerCase()
            );
            return entry ? {
                ingredients: entry.ingredients,
                allergens: entry.allergens
            } : {
                ingredients: [],
                allergens: []
            };
        }

        // Check user allergy
        function checkUserAllergy(userId, allergens) {
            const userHealth = HEALTH_DATA.find(user => user.user_id === userId);
            
            if (!userHealth) {
                return {
                    message: `❌ User ID ${userId} not found.`,
                    isAllergic: false,
                    allergyCategory: null
                };
            }

            const allergyCategory = userHealth.food_type;
            const isAllergic = userHealth.allergic === 1;

            if (!isAllergic) {
                return {
                    message: "✅ No known allergies for this user.",
                    isAllergic: false,
                    allergyCategory: null
                };
            }

            // Check if any food allergens match user's allergy category
            const foodAllergenClasses = allergens.map(a => 
                ALLERGEN_CATEGORY_MAP[a.toLowerCase()] || "unknown"
            );

            const hasMatchingAllergen = foodAllergenClasses.includes(allergyCategory);

            if (hasMatchingAllergen) {
                const matchedAllergens = allergens.filter(a => 
                    ALLERGEN_CATEGORY_MAP[a.toLowerCase()] === allergyCategory
                );
                return {
                    message: `⚠️ User is allergic to ${allergyCategory}, and this food contains: ${matchedAllergens.join(', ')}`,
                    isAllergic: true,
                    allergyCategory: allergyCategory,
                    matchedAllergens: matchedAllergens
                };
            } else {
                return {
                    message: `⚠️ User has an allergy to ${allergyCategory}, but this food contains different allergen classes: ${[...new Set(foodAllergenClasses)].join(', ')}`,
                    isAllergic: true,
                    allergyCategory: allergyCategory
                };
            }
        }

        // Get food emoji for different types
        function getFoodEmoji(foodName) {
            const foodEmojis = {
                'jollof rice': '🍛',
                'rice': '🍚',
                'suya': '🍖',
                'akara': '🥙',
                'egusi soup': '🍲',
                'soup': '🍲',
                'stew': '🍲',
                'beans': '🌿',
                'plantain': '🍌',
                'yam': '🍠',
                'chicken': '🍗',
                'fish': '🐟'
            };
            
            const lowerFood = foodName.toLowerCase();
            for (const [key, emoji] of Object.entries(foodEmojis)) {
                if (lowerFood.includes(key)) {
                    return emoji;
                }
            }
            return '🍽️';
        }

        // API Health Check
        async function checkApiHealth() {
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                const health = await response.json();
                return health.status === 'healthy';
            } catch (error) {
                console.warn('API not available, using simulation mode');
                return false;
            }
        }

        // Main prediction function
        predictBtn.addEventListener('click', async () => {
            if (!currentImage) return;

            const userId = document.getElementById('userId').value;
            const btnText = document.getElementById('btnText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            // Show loading state
            predictBtn.classList.add('loading');
            btnText.textContent = 'Analyzing...';
            loadingSpinner.style.display = 'block';
            
            results.style.display = 'block';
            document.getElementById('prediction').innerHTML = `
                <div style="text-align: center; padding: 40px; color: #4facfe;">
                    <i class="fas fa-cog fa-spin" style="font-size: 2rem; margin-bottom: 15px;"></i>
                    <p style="font-size: 1.1rem; font-weight: 500;">Analyzing your food image with AI...</p>
                    <p style="font-size: 0.9rem; color: #718096;">Using deep learning model for accurate prediction</p>
                </div>
            `;

            try {
                // Try to use the real Keras model via API
                const result = await predictWithKerasModel(currentImage, userId);
                
                let prediction, ingredients, allergens, allergyCheck;
                let isSimulated = result.isSimulated || false;

                if (result.success && result.prediction) {
                    // Real API response
                    prediction = result.prediction;
                    ingredients = result.ingredients || [];
                    allergens = result.allergens || [];
                    allergyCheck = result.allergyCheck;
                } else {
                    // Fallback simulation
                    const simResult = simulatePrediction();
                    prediction = simResult.prediction;
                    ingredients = simResult.ingredients;
                    allergens = simResult.allergens;
                    allergyCheck = checkUserAllergy(userId, allergens);
                    isSimulated = true;
                }

                const foodEmoji = getFoodEmoji(prediction.food);

                // Reset button state
                predictBtn.classList.remove('loading');
                btnText.textContent = 'Analyze Food & Check Allergies';
                loadingSpinner.style.display = 'none';

                // Display prediction results with enhanced UI
                document.getElementById('prediction').innerHTML = `
                    <div class="prediction-header">
                        <div class="food-emoji">${foodEmoji}</div>
                        <div>
                            <div class="food-name">${prediction.food}</div>
                            <div style="color: #718096; font-size: 0.9rem;">
                                ${isSimulated ? '🎭 Simulation Mode' : '🤖 AI Prediction'}
                                ${!isSimulated ? ' • Keras Model' : ''}
                            </div>
                        </div>
                    </div>
                    
                    <div style="margin: 20px 0;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <span style="font-weight: 500; color: #4a5568;">Confidence Level</span>
                            <span style="font-weight: 600; color: #4facfe;">${(prediction.confidence * 100).toFixed(1)}%</span>
                        </div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${prediction.confidence * 100}%;"></div>
                        </div>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <h4><i class="fas fa-list-ul"></i> Ingredients</h4>
                            <p>${ingredients.join(', ') || 'Information not available'}</p>
                        </div>
                        <div class="info-item">
                            <h4><i class="fas fa-exclamation-triangle"></i> Allergens</h4>
                            <p>${allergens.length > 0 ? allergens.join(', ') : 'None detected'}</p>
                        </div>
                    </div>
                `;

                // Display allergy check results with enhanced styling
                const allergenDiv = document.getElementById('allergenCheck');
                if (allergyCheck && allergyCheck.isAllergic && allergyCheck.matchedAllergens) {
                    allergenDiv.innerHTML = `
                        <div class="allergen-warning">
                            <div class="alert-header">
                                <i class="fas fa-exclamation-circle alert-icon" style="color: #f56565;"></i>
                                <h4 class="alert-title" style="color: #742a2a;">⚠️ ALLERGY WARNING</h4>
                            </div>
                            <div class="alert-message" style="color: #742a2a;">
                                ${allergyCheck.message}
                            </div>
                            <div class="recommendation" style="color: #742a2a;">
                                <i class="fas fa-ban"></i> <strong>Recommendation:</strong> DO NOT consume this food! Seek medical attention if consumed.
                            </div>
                        </div>
                    `;
                } else if (allergyCheck && allergyCheck.isAllergic) {
                    allergenDiv.innerHTML = `
                        <div class="allergen-info">
                            <div class="alert-header">
                                <i class="fas fa-info-circle alert-icon" style="color: #3182ce;"></i>
                                <h4 class="alert-title" style="color: #2c5282;">ℹ️ Allergy Information</h4>
                            </div>
                            <div class="alert-message" style="color: #2c5282;">
                                ${allergyCheck.message}
                            </div>
                            <div class="recommendation" style="color: #2c5282;">
                                <i class="fas fa-check-circle"></i> <strong>Note:</strong> This food appears safe for your specific allergy profile.
                            </div>
                        </div>
                    `;
                } else {
                    allergenDiv.innerHTML = `
                        <div class="allergen-safe">
                            <div class="alert-header">
                                <i class="fas fa-check-circle alert-icon" style="color: #38a169;"></i>
                                <h4 class="alert-title" style="color: #276749;">✅ Safe to Consume</h4>
                            </div>
                            <div class="alert-message" style="color: #276749;">
                                ${allergyCheck ? allergyCheck.message : 'No known allergens detected for this user profile.'}
                            </div>
                            <div class="recommendation" style="color: #276749;">
                                <i class="fas fa-thumbs-up"></i> <strong>Recommendation:</strong> No known allergens detected for this user profile.
                            </div>
                        </div>
                    `;
                }

                // Scroll to results
                results.scrollIntoView({ behavior: 'smooth', block: 'start' });

            } catch (error) {
                console.error('Prediction failed:', error);
                
                // Reset button state
                predictBtn.classList.remove('loading');
                btnText.textContent = 'Analyze Food & Check Allergies';
                loadingSpinner.style.display = 'none';

                // Show error message
                document.getElementById('prediction').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #f56565;">
                        <i class="fas fa-exclamation-circle" style="font-size: 2rem; margin-bottom: 15px;"></i>
                        <p style="font-size: 1.1rem; font-weight: 500;">Analysis Failed</p>
                        <p style="font-size: 0.9rem; color: #718096;">Please check your connection and try again</p>
                        <button onclick="location.reload()" style="margin-top: 15px; padding: 8px 16px; background: #f56565; color: white; border: none; border-radius: 6px; cursor: pointer;">
                            Retry
                        </button>
                    </div>
                `;
            }
        });

        // Initialize and check API status
        async function initialize() {
            console.log('🚀 Initializing Food Allergy Classifier...');
            
            // Check if API is available
            const apiHealthy = await checkApiHealth();
            
            if (apiHealthy) {
                console.log('✅ Connected to Keras model API');
                // Add API status indicator
                document.querySelector('.header p').innerHTML = 
                    'Advanced food recognition with intelligent allergy detection powered by machine learning<br>' +
                    '<span style="background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 15px; font-size: 0.8rem; margin-top: 5px; display: inline-block;">' +
                    '🤖 Keras Model Active</span>';
            } else {
                console.log('⚠️ API not available - Using simulation mode');
                // Add simulation mode indicator
                document.querySelector('.header p').innerHTML = 
                    'Advanced food recognition with intelligent allergy detection powered by machine learning<br>' +
                    '<span style="background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 15px; font-size: 0.8rem; margin-top: 5px; display: inline-block;">' +
                    '🎭 Demo Mode - Start API for real predictions</span>';
            }
        }

        // Start initialization
        initialize();
    </script>
</body>
</html>
